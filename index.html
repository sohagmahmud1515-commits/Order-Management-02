<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087b80">

<title>অর্ডার ম্যানেজমেন্ট</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f8f7;
  color:#182027;
  padding-bottom:82px;
}

/* HEADER */
.header{
  height:92px;
  background:#087b80;
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:7px;
}

.title{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.core{
  font-size:11px;
  font-weight:700;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:46px;
  height:46px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:24px;
}

/* GROUPS */
.groups{
  max-width:650px;
  margin:17px auto;
  padding:0 15px;
}

.group-card{
  width:100%;
  height:96px;
  background:#fff;
  border:0;
  border-radius:18px;
  margin-bottom:13px;
  padding:12px 17px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  box-shadow:0 5px 15px rgba(0,0,0,.065);
  cursor:pointer;
}

.group-card:active{
  transform:scale(.985);
}

.group-icon{
  width:60px;
  height:60px;
  min-width:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.icon-all{background:#e6efff;}
.icon-pending{background:#fff1c5;}
.icon-emergency{background:#ffe0e0;}
.icon-delete{background:#eee3ff;}

.group-name{
  flex:1;
  font-size:19px;
  font-weight:800;
}

.count{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  font-weight:800;
}

.count-all{background:#2879e8;}
.count-pending{background:#ef9700;}
.count-emergency{background:#fa4048;}
.count-delete{background:#7544d8;}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  align-items:center;
  box-shadow:0 -3px 14px rgba(0,0,0,.06);
  z-index:100;
}

.nav-item{
  height:64px;
  border:0;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:2px;
  font-size:13px;
  font-weight:700;
  color:#606a6d;
}

.nav-item.active{
  margin:5px 12px;
  border-radius:14px;
  background:#e7f6f3;
  color:#087b80;
}

.nav-icon{
  font-size:25px;
}

/* SMALL PHONE */
@media(max-width:380px){
  .header{
    padding:12px 13px;
  }

  .title{
    font-size:19px;
  }

  .core{
    font-size:9px;
  }

  .header-btn{
    width:41px;
    height:41px;
    font-size:21px;
  }

  .groups{
    padding:0 12px;
  }

  .group-card{
    height:88px;
    padding:10px 13px;
  }

  .group-icon{
    width:54px;
    height:54px;
    min-width:54px;
    font-size:27px;
  }

  .group-name{
    font-size:17px;
  }

  .count{
    width:44px;
    height:44px;
    min-width:44px;
    font-size:18px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-left">
    <div class="title">অর্ডার ম্যানেজমেন্ট</div>
    <div class="core">FINAL CORE</div>
  </div>

  <div class="header-actions">

    <button class="header-btn"
      onclick="openModule('notifications')">
      🔔
    </button>

    <button class="header-btn"
      onclick="openModule('summary')">
      📊
    </button>

  </div>

</header>


<main class="groups">

  <button class="group-card"
    onclick="openModule('orders')">

    <div class="group-icon icon-all">📦</div>

    <div class="group-name">
      All Order Group
    </div>

    <div class="count count-all"
      id="allCount">0</div>

  </button>


  <button class="group-card"
    onclick="openModule('pending')">

    <div class="group-icon icon-pending">🕐</div>

    <div class="group-name">
      Pending Group
    </div>

    <div class="count count-pending"
      id="pendingCount">0</div>

  </button>


  <button class="group-card"
    onclick="openModule('emergency')">

    <div class="group-icon icon-emergency">🚨</div>

    <div class="group-name">
      Emergency Group
    </div>

    <div class="count count-emergency"
      id="emergencyCount">0</div>

  </button>


  <button class="group-card"
    onclick="openModule('delete')">

    <div class="group-icon icon-delete">🗑️</div>

    <div class="group-name">
      Delete Group
    </div>

    <div class="count count-delete"
      id="deleteCount">0</div>

  </button>

</main>


<nav class="bottom-nav">

  <button class="nav-item active"
    onclick="goHome()">

    <span class="nav-icon">📦</span>
    <span>Orders</span>

  </button>


  <button class="nav-item"
    onclick="openModule('courier')">

    <span class="nav-icon">🚚</span>
    <span>Courier</span>

  </button>


  <button class="nav-item"
    onclick="openModule('settings')">

    <span class="nav-icon">⚙️</span>
    <span>Settings</span>

  </button>

</nav>


<script>

/*
  ORDER MANAGEMENT 02
  HOME / FINAL CORE
*/

const MODULES = {
  orders:"modules/orders.html",
  pending:"modules/pending.html",
  emergency:"modules/emergency.html",
  delete:"modules/delete-approval.html",
  courier:"modules/courier.html",
  settings:"modules/settings.html",
  summary:"modules/summary.html",
  notifications:"modules/notifications.html"
};


function openModule(name){

  const path = MODULES[name];

  if(!path){
    alert("Module পাওয়া যায়নি");
    return;
  }

  window.location.href = path;
}


function goHome(){
  window.location.href="index.html";
}


/*
  Database module পরে এখানকার
  সংখ্যাগুলো real-time update করবে।
*/

function setGroupCounts(data={}){

  document.getElementById("allCount").textContent =
    data.all ?? 0;

  document.getElementById("pendingCount").textContent =
    data.pending ?? 0;

  document.getElementById("emergencyCount").textContent =
    data.emergency ?? 0;

  document.getElementById("deleteCount").textContent =
    data.delete ?? 0;
}


setGroupCounts({
  all:0,
  pending:0,
  emergency:0,
  delete:0
});

</script>

</body>
</html>
