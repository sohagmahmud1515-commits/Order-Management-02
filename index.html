<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087b80">

<title>অর্ডার ম্যানেজমেন্ট</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f8f7;
  color:#182027;
  padding-bottom:90px;
}

/* ===== HEADER ===== */

.header{
  background:#087b80;
  color:white;
  min-height:95px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.title{
  font-size:23px;
  font-weight:800;
  white-space:nowrap;
}

.core{
  font-size:12px;
  font-weight:700;
  opacity:.95;
}

.header-actions{
  display:flex;
  gap:10px;
}

.header-btn{
  width:48px;
  height:48px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.header-btn:active{
  transform:scale(.96);
}

/* ===== GROUP AREA ===== */

.groups{
  max-width:650px;
  margin:25px auto;
  padding:0 18px;
}

.group-card{
  width:100%;
  min-height:112px;
  background:white;
  border-radius:22px;
  margin-bottom:18px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  border:none;
  text-align:left;
  box-shadow:0 7px 20px rgba(0,0,0,.07);
  cursor:pointer;
}

.group-card:active{
  transform:scale(.985);
}

.group-icon{
  width:70px;
  height:70px;
  min-width:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.icon-all{
  background:#e7efff;
}

.icon-pending{
  background:#fff1c6;
}

.icon-emergency{
  background:#ffe1e1;
}

.icon-delete{
  background:#eee2ff;
}

.group-name{
  flex:1;
  font-size:21px;
  font-weight:800;
}

.count{
  width:55px;
  height:55px;
  min-width:55px;
  border-radius:50%;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:800;
}

.count-all{
  background:#2879e8;
}

.count-pending{
  background:#f09a00;
}

.count-emergency{
  background:#ff4049;
}

.count-delete{
  background:#7542d8;
}

/* ===== BOTTOM NAV ===== */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:white;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  align-items:center;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
  z-index:100;
}

.nav-item{
  height:65px;
  border:none;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:13px;
  font-weight:700;
  color:#5e666b;
  cursor:pointer;
}

.nav-item.active{
  margin:6px 12px;
  border-radius:15px;
  background:#e7f6f3;
  color:#087b80;
}

.nav-icon{
  font-size:25px;
}

/* ===== MOBILE ===== */

@media(max-width:430px){

  .header{
    min-height:88px;
    padding:15px 14px;
  }

  .title{
    font-size:20px;
  }

  .core{
    font-size:10px;
  }

  .header-btn{
    width:43px;
    height:43px;
    font-size:22px;
  }

  .groups{
    margin-top:20px;
    padding:0 14px;
  }

  .group-card{
    min-height:105px;
    padding:15px;
  }

  .group-icon{
    width:62px;
    height:62px;
    min-width:62px;
    font-size:30px;
  }

  .group-name{
    font-size:19px;
  }

  .count{
    width:50px;
    height:50px;
    min-width:50px;
    font-size:20px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="header-left">
    <div class="title">অর্ডার ম্যানেজমেন্ট</div>
    <div class="core">FINAL CORE</div>
  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      type="button"
      onclick="openModule('notifications')"
      aria-label="Notifications">
      🔔
    </button>

    <button
      class="header-btn"
      type="button"
      onclick="openModule('summary')"
      aria-label="Summary">
      📊
    </button>

  </div>

</header>


<!-- GROUP LIST -->

<main class="groups">

  <button
    class="group-card"
    type="button"
    onclick="openModule('orders')">

    <div class="group-icon icon-all">📦</div>

    <div class="group-name">
      All Order Group
    </div>

    <div
      class="count count-all"
      id="allCount">
      0
    </div>

  </button>


  <button
    class="group-card"
    type="button"
    onclick="openModule('pending')">

    <div class="group-icon icon-pending">🕐</div>

    <div class="group-name">
      Pending Group
    </div>

    <div
      class="count count-pending"
      id="pendingCount">
      0
    </div>

  </button>


  <button
    class="group-card"
    type="button"
    onclick="openModule('emergency')">

    <div class="group-icon icon-emergency">🚨</div>

    <div class="group-name">
      Emergency Group
    </div>

    <div
      class="count count-emergency"
      id="emergencyCount">
      0
    </div>

  </button>


  <button
    class="group-card"
    type="button"
    onclick="openModule('delete')">

    <div class="group-icon icon-delete">🗑️</div>

    <div class="group-name">
      Delete Approval
    </div>

    <div
      class="count count-delete"
      id="deleteCount">
      0
    </div>

  </button>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    type="button"
    onclick="goHome()">

    <span class="nav-icon">📦</span>
    <span>Orders</span>

  </button>


  <button
    class="nav-item"
    type="button"
    onclick="openModule('courier')">

    <span class="nav-icon">🚚</span>
    <span>Courier</span>

  </button>


  <button
    class="nav-item"
    type="button"
    onclick="openModule('settings')">

    <span class="nav-icon">⚙️</span>
    <span>Settings</span>

  </button>

</nav>


<script>

/*
================================================
ORDER MANAGEMENT 02
FINAL CORE / HOME
================================================

HOME = index.html

Other systems remain separate modules.
This allows one module to be updated without
changing the other working modules.
*/


const MODULES = {

  orders:
    "modules/orders.html",

  pending:
    "modules/pending.html",

  emergency:
    "modules/emergency.html",

  delete:
    "modules/delete-approval.html",

  courier:
    "modules/courier.html",

  settings:
    "modules/settings.html",

  summary:
    "modules/summary.html",

  notifications:
    "modules/notifications.html"

};


/* OPEN MODULE */

function openModule(name){

  const path = MODULES[name];

  if(!path){
    alert("Module পাওয়া যায়নি");
    return;
  }

  window.location.href = path;
}


/* HOME */

function goHome(){
  window.location.href = "index.html";
}


/* UPDATE COUNTS */

function setGroupCounts(data = {}){

  document.getElementById("allCount").textContent =
    data.all ?? 0;

  document.getElementById("pendingCount").textContent =
    data.pending ?? 0;

  document.getElementById("emergencyCount").textContent =
    data.emergency ?? 0;

  document.getElementById("deleteCount").textContent =
    data.delete ?? 0;
}


/*
Later the Database module will supply
the real-time counts here.

Example:

setGroupCounts({
  all: 12,
  pending: 5,
  emergency: 2,
  delete: 1
});

*/


setGroupCounts({
  all:0,
  pending:0,
  emergency:0,
  delete:0
});


console.log(
  "Order Management 02 - Final Core Ready"
);

</script>

</body>
</html>
