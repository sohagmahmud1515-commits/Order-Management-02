<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f83">

<title>All Order Group</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f8f7;
  color:#17202a;
  padding-bottom:85px;
}

.header{
  height:72px;
  background:#087f83;
  color:#fff;
  padding:0 15px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:50;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:22px;
}

.header-title{
  font-size:20px;
  font-weight:800;
}

.container{
  max-width:650px;
  margin:auto;
  padding:14px;
}

.search{
  width:100%;
  height:48px;
  border:1px solid #d7e1df;
  border-radius:13px;
  padding:0 14px;
  font-size:16px;
  outline:none;
  background:white;
  margin-bottom:12px;
}

.submit-card{
  background:white;
  border-radius:17px;
  padding:14px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.submit-title{
  font-size:17px;
  font-weight:800;
  color:#087f83;
  margin-bottom:12px;
}

.field{
  margin-bottom:12px;
}

.label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

select,
textarea{
  width:100%;
  border:1px solid #d7e1df;
  border-radius:12px;
  background:white;
  font-size:16px;
  outline:none;
}

select{
  height:48px;
  padding:0 12px;
}

textarea{
  min-height:145px;
  padding:12px;
  resize:vertical;
  line-height:1.5;
}

.upload-box{
  border:2px dashed #b8cfcb;
  border-radius:13px;
  padding:14px;
  text-align:center;
  background:#f9fcfb;
}

.upload-box input{
  width:100%;
}

.hint{
  font-size:12px;
  color:#687473;
  margin-top:6px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px;
}

.preview-item{
  position:relative;
  aspect-ratio:1/1;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:9px;
}

.remove-image{
  position:absolute;
  right:-4px;
  top:-4px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#e53935;
  color:white;
  font-weight:bold;
}

.submit-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:#087f83;
  color:white;
  font-size:17px;
  font-weight:800;
}

.submit-btn:disabled{
  opacity:.6;
}

.status{
  margin-top:10px;
  font-size:14px;
  font-weight:700;
  line-height:1.5;
  white-space:pre-line;
}

.orders-title{
  font-size:17px;
  font-weight:800;
  margin:4px 2px 10px;
}

.order-card{
  background:white;
  border-radius:16px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
  margin-bottom:9px;
}

.order-number{
  font-size:15px;
  font-weight:800;
}

.page-badge{
  background:#e4f4f1;
  color:#087f83;
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.order-images{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:9px;
}

.order-images img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

.order-text{
  white-space:pre-wrap;
  line-height:1.5;
  font-size:14px;
  overflow-wrap:anywhere;
}

.meta{
  border-top:1px solid #edf1f0;
  margin-top:10px;
  padding-top:8px;
  font-size:12px;
  color:#687473;
  line-height:1.5;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#75807e;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  box-shadow:0 -3px 12px rgba(0,0,0,.06);
  z-index:60;
}

.nav-btn{
  border:0;
  background:white;
  font-size:13px;
  font-weight:700;
  color:#5e6867;
}

.nav-btn.active{
  color:#087f83;
  background:#e8f6f3;
}

.nav-icon{
  display:block;
  font-size:23px;
  margin-bottom:2px;
}
</style>
</head>

<body>

<header class="header">
  <button class="back" onclick="goHome()">‹</button>
  <div class="header-title">All Order Group</div>
</header>

<main class="container">

  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="নাম / মোবাইল / লোকেশন / Order No. দিয়ে Search"
  >

  <section class="submit-card">

    <div class="submit-title">
      নতুন অর্ডার সাবমিট
    </div>

    <div class="field">
      <label class="label">Page</label>

      <select id="pageSelect">
        <option value="">পেজ সিলেক্ট করুন</option>
        <option value="Sehzadi online shop">Sehzadi online shop</option>
        <option value="Abaya House">Abaya House</option>
        <option value="Maya Borka House">Maya Borka House</option>
        <option value="Mahira Fashion">Mahira Fashion</option>
        <option value="Black Beauty Abaya">Black Beauty Abaya</option>
      </select>
    </div>

    <div class="field">
      <label class="label">
        ছবি
      </label>

      <div class="upload-box">
        <input
          id="imageInput"
          type="file"
          accept="image/*"
          multiple
        >

        <div class="hint">
          কমপক্ষে ১টি, সর্বোচ্চ ৭টি ছবি
        </div>

        <div
          id="imagePreview"
          class="preview">
        </div>
      </div>
    </div>

    <div class="field">
      <label class="label">
        কাস্টমারের সম্পূর্ণ অর্ডার
      </label>

      <textarea
        id="orderText"
        placeholder="নাম, মোবাইল নাম্বার, ঠিকানা, লং/সাইজ, কালার, পরিমাণ, নোট—সব এখানে লিখুন"></textarea>
    </div>

    <button
      id="submitBtn"
      class="submit-btn"
      type="button">
      অর্ডার সাবমিট
    </button>

    <div
      id="statusBox"
      class="status">
    </div>

  </section>


  <div class="orders-title">
    All Orders
  </div>

  <div id="orderList">
    <div class="empty">
      Loading...
    </div>
  </div>

</main>


<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()">
    <span class="nav-icon">📦</span>
    Orders
  </button>

  <button
    class="nav-btn"
    onclick="goCourier()">
    <span class="nav-icon">🚚</span>
    Courier
  </button>

  <button
    class="nav-btn"
    onclick="goSettings()">
    <span class="nav-icon">⚙️</span>
    Settings
  </button>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./database.js"></script>

<script>
let selectedImages = [];
let allOrders = [];

const imageInput =
  document.getElementById("imageInput");

const imagePreview =
  document.getElementById("imagePreview");

const submitBtn =
  document.getElementById("submitBtn");

const statusBox =
  document.getElementById("statusBox");

const searchInput =
  document.getElementById("searchInput");


function goHome(){
  window.location.href = "../index.html";
}

function goCourier(){
  window.location.href = "./courier.html";
}

function goSettings(){
  window.location.href = "./settings.html";
}


/* IMAGE SELECT */

imageInput.addEventListener(
  "change",
  function(){

    const incoming =
      Array.from(this.files || []);

    if(!incoming.length){
      return;
    }

    const remaining =
      7 - selectedImages.length;

    if(remaining <= 0){
      alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
      this.value = "";
      return;
    }

    if(incoming.length > remaining){
      alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
    }

    selectedImages.push(
      ...incoming.slice(0, remaining)
    );

    this.value = "";

    renderPreview();
  }
);


function renderPreview(){

  imagePreview.innerHTML = "";

  selectedImages.forEach(
    function(file,index){

      const item =
        document.createElement("div");

      item.className =
        "preview-item";

      const img =
        document.createElement("img");

      const url =
        URL.createObjectURL(file);

      img.src = url;

      img.onload = function(){
        URL.revokeObjectURL(url);
      };

      const remove =
        document.createElement("button");

      remove.type = "button";
      remove.className = "remove-image";
      remove.textContent = "×";

      remove.onclick = function(){

        selectedImages.splice(
          index,
          1
        );

        renderPreview();
      };

      item.appendChild(img);
      item.appendChild(remove);

      imagePreview.appendChild(item);
    }
  );
}


/* SUBMIT */

submitBtn.addEventListener(
  "click",
  submitOrder
);


async function submitOrder(){

  const page =
    document
      .getElementById("pageSelect")
      .value
      .trim();

  const text =
    document
      .getElementById("orderText")
      .value
      .trim();

  if(!page){
    alert("পেজ সিলেক্ট করুন।");
    return;
  }

  if(selectedImages.length < 1){
    alert("অন্তত ১টি ছবি দিন।");
    return;
  }

  if(!text){
    alert("কাস্টমারের সম্পূর্ণ অর্ডার লিখুন।");
    return;
  }

  /*
    database.js অর্ডারের সম্পূর্ণ লেখা থেকে
    ১১ সংখ্যার English মোবাইল নাম্বার বের করবে।
  */

  if(!/01\d{9}/.test(text)){
    alert(
      "অর্ডারের মধ্যে ১১ সংখ্যার English মোবাইল নাম্বার দিন।\nযেমন: 01712345678"
    );
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent =
    "সাবমিট হচ্ছে...";

  statusBox.textContent =
    "অর্ডার Save হচ্ছে...";

  try{

    if(
      !window.OrderDatabase ||
      typeof window.OrderDatabase.save !== "function"
    ){
      throw new Error(
        "Database module load হয়নি।"
      );
    }

    await window.OrderDatabase.save({
      page: page,

      /*
        দুটো নামই পাঠানো হচ্ছে,
        তাই পুরোনো/নতুন database.js উভয়ের
        সঙ্গে compatibility থাকবে।
      */
      orderText: text,
      customerText: text,

      images: selectedImages,

      submittedBy: "Admin",

      moderatorWhatsapp: ""
    });

    statusBox.textContent =
      "✓ অর্ডার সফলভাবে Save হয়েছে।";

    document
      .getElementById("orderText")
      .value = "";

    selectedImages = [];
    imagePreview.innerHTML = "";

    await loadOrders();

  }catch(error){

    console.error(error);

    statusBox.textContent =
      "✕ " +
      (
        error &&
        error.message
          ? error.message
          : "অর্ডার Save হয়নি।"
      );

    alert(statusBox.textContent);

  }finally{

    submitBtn.disabled = false;

    submitBtn.textContent =
      "অর্ডার সাবমিট";
  }
}


/* LOAD ORDERS */

async function loadOrders(){

  const list =
    document.getElementById("orderList");

  try{

    if(
      !window.OrderDatabase ||
      typeof window.OrderDatabase.loadAll !== "function"
    ){
      throw new Error(
        "Database module load হয়নি।"
      );
    }

    allOrders =
      await window.OrderDatabase.loadAll();

    renderOrders(
      allOrders
    );

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="empty">' +
      escapeHtml(
        error.message ||
        "অর্ডার Load হয়নি।"
      ) +
      "</div>";
  }
}


/* SEARCH */

searchInput.addEventListener(
  "input",
  function(){

    const query =
      this.value
        .trim()
        .toLowerCase();

    if(!query){

      renderOrders(
        allOrders
      );

      return;
    }

    const filtered =
      allOrders.filter(
        function(order){

          const text = [
            order.order_no,
            order.page_name,
            order.customer_text,
            order.order_text,
            order.phone,
            order.submitted_by
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

          return text.includes(query);
        }
      );

    renderOrders(filtered);
  }
);


/* RENDER */

function renderOrders(orders){

  const list =
    document.getElementById("orderList");

  if(!orders || !orders.length){

    list.innerHTML =
      '<div class="empty">কোনো অর্ডার নেই।</div>';

    return;
  }

  list.innerHTML =
    orders
      .map(createOrderCard)
      .join("");
}


function createOrderCard(order){

  const text =
    order.customer_text ||
    order.order_text ||
    "";

  let images = [];

  if(Array.isArray(order.images)){
    images = order.images;
  }
  else if(Array.isArray(order.image_urls)){
    images = order.image_urls;
  }

  const orderNumber =
    order.order_no ||
    String(order.id || "")
      .slice(0,8)
      .toUpperCase();

  const date =
    formatDateTime(
      order.created_at
    );

  const imagesHtml =
    images.length
      ? (
          '<div class="order-images">' +
          images
            .map(
              url =>
                '<img src="' +
                escapeAttribute(url) +
                '" loading="lazy" alt="Order image">'
            )
            .join("") +
          "</div>"
        )
      : "";

  return `
    <article class="order-card">

      <div class="order-top">

        <div class="order-number">
          Order #${escapeHtml(orderNumber)}
        </div>

        <div class="page-badge">
          ${escapeHtml(order.page_name || "")}
        </div>

      </div>

      ${imagesHtml}

      <div class="order-text">${escapeHtml(text)}</div>

      <div class="meta">
        Submitted By:
        ${escapeHtml(order.submitted_by || "Admin")}
        <br>
        ${escapeHtml(date)}
      </div>

    </article>
  `;
}


/* DATE TIME */

function formatDateTime(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleString(
    "en-BD",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  );
}


/* SAFE HTML */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function escapeAttribute(value){
  return escapeHtml(value);
}


/* REALTIME */

function startRealtime(){

  if(
    window.OrderDatabase &&
    typeof window.OrderDatabase.realtime === "function"
  ){

    window.OrderDatabase.realtime(
      function(){

        loadOrders();

      }
    );
  }
}


/* START */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    try{

      if(
        window.OrderDatabase &&
        typeof window.OrderDatabase.init === "function"
      ){
        window.OrderDatabase.init();
      }

      await loadOrders();

      startRealtime();

    }catch(error){

      console.error(error);
    }

  }
);

</script>

</body>
</html>
