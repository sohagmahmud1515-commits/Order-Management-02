<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f83">

<title>All Order Group</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f8f7;
  color:#17202a;
  padding-bottom:78px;
}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

/* HEADER */

.header{
  height:68px;
  background:#087f83;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:11px;
  position:sticky;
  top:0;
  z-index:100;
}

.back{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:23px;
}

.header-title{
  font-size:20px;
  font-weight:800;
}

.container{
  max-width:650px;
  margin:auto;
  padding:10px;
}

.search{
  width:100%;
  height:44px;
  background:#fff;
  border:1px solid #d8e1df;
  border-radius:12px;
  padding:0 13px;
  font-size:14px;
  outline:none;
  margin-bottom:10px;
}

/* SUBMIT */

.submit-card{
  background:#fff;
  border-radius:15px;
  padding:12px;
  margin-bottom:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.submit-title{
  font-size:16px;
  font-weight:900;
  color:#087f83;
  margin-bottom:9px;
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:9px 0 5px;
}

select,textarea{
  width:100%;
  border:1px solid #d4dfdd;
  border-radius:10px;
  background:#fff;
  font-size:14px;
  outline:none;
}

select{
  height:44px;
  padding:0 10px;
}

textarea{
  min-height:125px;
  padding:10px;
  resize:vertical;
  line-height:1.55;
}

.upload-box{
  border:2px dashed #b9cfcb;
  border-radius:10px;
  padding:10px;
  background:#fafdfc;
}

.upload-note{
  font-size:11px;
  color:#697472;
  margin-top:5px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:8px;
}

.preview-item{
  position:relative;
  aspect-ratio:1;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:7px;
}

.remove-image{
  position:absolute;
  right:-4px;
  top:-4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#e53935;
  color:#fff;
  font-weight:bold;
}

.submit-btn{
  width:100%;
  height:46px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#087f83;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.submit-btn:disabled{opacity:.55}

.save-status{
  margin-top:7px;
  font-size:12px;
  font-weight:800;
  white-space:pre-line;
}

.list-title{
  font-size:16px;
  font-weight:900;
  margin:4px 2px 8px;
}

/* ========================
   FINAL ORDER CARD
======================== */

.order-card{
  position:relative;
  background:#fff;
  border-radius:18px;
  padding:9px;
  margin-bottom:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.09);
  overflow:hidden;
}

/* IMAGE */

.main-image-wrap{
  width:100%;
  height:285px;
  border-radius:14px;
  overflow:hidden;
  background:#f1f5f4;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
}

.main-image{
  display:block;
  width:auto;
  height:100%;
  max-width:100%;
  max-height:285px;
  object-fit:contain;
}

.more-images{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin:5px 0 7px;
}

.more-images img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:7px;
}

/* ORDER NUMBER */

.order-number{
  text-align:left;
  color:#087f83;
  font-size:18px;
  font-weight:900;
  margin:7px 3px 8px;
}

/* INFO STRIP */

.info-box{
  display:grid;
  grid-template-columns:1.18fr 1.05fr 1fr 1.18fr;
  border:1px solid #dce6e4;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
  margin-bottom:7px;
}

.info-cell{
  min-width:0;
  min-height:58px;
  padding:6px 5px;
  border-right:1px solid #e3eae9;
  font-size:9px;
  color:#6e7876;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.info-cell:last-child{border-right:0}

.info-label{
  display:flex;
  align-items:center;
  gap:2px;
  white-space:nowrap;
}

.info-value{
  display:block;
  margin-top:3px;
  color:#1e2928;
  font-size:10px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.token-date{
  display:block;
  font-size:8px;
  margin-top:2px;
  color:#707a78;
  font-weight:700;
}

.submitter-wa{
  min-height:29px;
  border:1px solid #2aa55d;
  border-radius:8px;
  background:#f0fbf4;
  color:#168646;
  font-size:9px;
  font-weight:900;
  padding:3px 4px;
  margin-top:3px;
  overflow-wrap:anywhere;
}

/* ACTIONS */

.action-row{
  display:grid;
  grid-template-columns:1.15fr 1fr .82fr;
  gap:5px;
  margin:7px 0 5px;
}

.action-btn{
  min-height:35px;
  border:0;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
}

.pending-btn{
  background:#ffe1e4;
  color:#d42d3c;
}

.emergency-btn{
  background:#ffe1e4;
  color:#d42d3c;
}

.fraud-btn{
  background:#e5f0ff;
  color:#2768c6;
}

.delete-btn{
  background:#edf0f0;
  color:#596260;
}

/* CALL STATUS */

.call-status-row{
  display:flex;
  justify-content:flex-end;
  margin:5px 1px 6px;
}

.call-status-btn{
  min-width:91px;
  min-height:31px;
  padding:4px 10px;
  border:0;
  border-radius:16px;
  font-size:11px;
  font-weight:900;
}

.call-not-done{
  background:#ffe3e5;
  color:#d32d39;
}

.call-done{
  background:#e2f7e8;
  color:#138747;
}

/* FRAUD */

.fraud-result{
  display:none;
  border:1px solid #d7e5ff;
  background:#f3f7ff;
  border-radius:9px;
  padding:8px;
  font-size:11px;
  line-height:1.5;
  margin-bottom:6px;
}

/* ORDER TEXT */

.customer-text{
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:6px 4px 8px;
  min-height:0;
}

/* CUSTOMER CONTACT */

.contact-row{
  display:flex;
  gap:6px;
  justify-content:flex-start;
  margin:4px 3px 7px;
}

.contact-btn{
  min-width:94px;
  height:35px;
  padding:0 11px;
  border:0;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

.whatsapp-btn{
  background:#dff7e6;
  color:#11853e;
}

.phone-btn{
  background:#e2efff;
  color:#2467c5;
}

/* STATUS */

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin:5px 3px 3px;
}

.status-left{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
}

.status-pill{
  min-height:27px;
  padding:5px 10px;
  border-radius:20px;
  background:#fff0c7;
  color:#9b6900;
  font-size:10px;
  font-weight:900;
}

.emergency-note{
  min-height:27px;
  padding:5px 9px;
  border-radius:20px;
  background:#ffe1e1;
  color:#d62d35;
  font-size:9px;
  font-weight:900;
  display:flex;
  align-items:center;
}

.token-bottom{
  font-size:9px;
  color:#78817f;
}

/* BOTTOM CARD ACTIONS */

.card-bottom-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding:0 3px 2px;
}

.square-btn{
  width:39px;
  height:39px;
  border:0;
  border-radius:50%;
  font-size:17px;
  font-weight:900;
}

.edit-btn{
  background:#ffe39a;
  color:#7c5b00;
}

.up-btn{
  width:44px;
  height:44px;
  background:#087f83;
  color:#fff;
  font-size:21px;
}

/* EDIT */

.edit-area{
  display:none;
  margin-top:7px;
  border-top:1px solid #edf1f0;
  padding-top:8px;
}

.edit-area textarea{
  min-height:115px;
}

.edit-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:6px;
}

.edit-save,
.edit-cancel{
  height:36px;
  border:0;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
}

.edit-save{
  background:#087f83;
  color:#fff;
}

.edit-cancel{
  background:#edf1f0;
  color:#444;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#747e7c;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  box-shadow:0 -3px 12px rgba(0,0,0,.06);
  z-index:100;
}

.nav-btn{
  border:0;
  background:#fff;
  color:#616b69;
  font-size:12px;
  font-weight:700;
}

.nav-btn.active{
  color:#087f83;
  background:#e7f6f3;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:2px;
}

@media(max-width:380px){
  .container{padding:8px}
  .order-card{padding:8px}
  .main-image-wrap{height:260px}
  .main-image{max-height:260px}

  .info-cell{
    padding:5px 3px;
    font-size:8px;
  }

  .info-value{font-size:9px}
  .submitter-wa{font-size:8px}
}
</style>
</head>

<body>

<header class="header">
  <button class="back" onclick="goHome()">‹</button>
  <div class="header-title">All Order Group</div>
</header>

<main class="container">

<input
  id="searchInput"
  class="search"
  type="search"
  placeholder="নাম / মোবাইল / লোকেশন / Order No. দিয়ে Search">

<section class="submit-card">

<div class="submit-title">নতুন অর্ডার সাবমিট</div>

<label class="label">Page</label>

<select id="pageSelect">
  <option value="">পেজ সিলেক্ট করুন</option>
  <option value="Sehzadi online shop">Sehzadi online shop</option>
  <option value="Abaya House">Abaya House</option>
  <option value="Maya Borka House">Maya Borka House</option>
  <option value="Mahira Fashion">Mahira Fashion</option>
  <option value="Black Beauty Abaya">Black Beauty Abaya</option>
</select>

<label class="label">ছবি</label>

<div class="upload-box">
  <input id="imageInput" type="file" accept="image/*" multiple>

  <div class="upload-note">
    কমপক্ষে ১টি, সর্বোচ্চ ৭টি ছবি
  </div>

  <div id="imagePreview" class="preview"></div>
</div>

<label class="label">কাস্টমারের সম্পূর্ণ অর্ডার</label>

<textarea
  id="orderText"
  placeholder="নাম, মোবাইল নাম্বার, ঠিকানা, লং/সাইজ, কালার, পরিমাণ, নোট—সব এখানে লিখুন"></textarea>

<button id="submitBtn" class="submit-btn" type="button">
  অর্ডার সাবমিট
</button>

<div id="saveStatus" class="save-status"></div>

</section>

<div class="list-title">All Orders</div>

<div id="orderList">
  <div class="empty">Loading...</div>
</div>

</main>

<nav class="bottom-nav">

<button class="nav-btn active" onclick="goHome()">
  <span class="nav-icon">📦</span>
  Orders
</button>

<button class="nav-btn" onclick="goCourier()">
  <span class="nav-icon">🚚</span>
  Courier
</button>

<button class="nav-btn" onclick="goSettings()">
  <span class="nav-icon">⚙️</span>
  Settings
</button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./database.js"></script>

<script>

let selectedImages=[];
let allOrders=[];

function goHome(){location.href="../index.html"}
function goCourier(){location.href="./courier.html"}
function goSettings(){location.href="./settings.html"}

/* IMAGE */

const imageInput=document.getElementById("imageInput");

imageInput.addEventListener("change",function(){

  const files=Array.from(this.files||[]);
  if(!files.length)return;

  const remaining=7-selectedImages.length;

  if(remaining<=0){
    alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
    this.value="";
    return;
  }

  if(files.length>remaining){
    alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
  }

  selectedImages.push(...files.slice(0,remaining));
  this.value="";
  renderPreview();
});

function renderPreview(){

  const box=document.getElementById("imagePreview");
  box.innerHTML="";

  selectedImages.forEach((file,index)=>{

    const wrap=document.createElement("div");
    wrap.className="preview-item";

    const img=document.createElement("img");
    const url=URL.createObjectURL(file);

    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="remove-image";
    remove.textContent="×";

    remove.onclick=()=>{
      selectedImages.splice(index,1);
      renderPreview();
    };

    wrap.appendChild(img);
    wrap.appendChild(remove);
    box.appendChild(wrap);
  });
}

/* SUBMIT */

document.getElementById("submitBtn")
.addEventListener("click",submitOrder);

async function submitOrder(){

  const page=document.getElementById("pageSelect").value.trim();
  const text=document.getElementById("orderText").value.trim();

  if(!page){
    alert("পেজ সিলেক্ট করুন।");
    return;
  }

  if(selectedImages.length<1){
    alert("অন্তত ১টি ছবি দিন।");
    return;
  }

  if(!text){
    alert("কাস্টমারের সম্পূর্ণ অর্ডার লিখুন।");
    return;
  }

  if(!/01\d{9}/.test(text)){
    alert("অর্ডারের মধ্যে ১১ সংখ্যার English মোবাইল নাম্বার দিন।");
    return;
  }

  const btn=document.getElementById("submitBtn");
  const status=document.getElementById("saveStatus");

  btn.disabled=true;
  btn.textContent="সাবমিট হচ্ছে...";

  try{

    await window.OrderDatabase.save({
      page:page,
      orderText:text,
      customerText:text,
      images:selectedImages,
      submittedBy:"Admin",
      moderatorWhatsapp:""
    });

    status.textContent="✓ অর্ডার সফলভাবে Save হয়েছে।";

    document.getElementById("orderText").value="";
    selectedImages=[];
    renderPreview();

    await loadOrders();

  }catch(error){

    console.error(error);

    const message=error?.message||"অর্ডার Save হয়নি।";

    status.textContent="✕ "+message;
    alert(message);

  }finally{

    btn.disabled=false;
    btn.textContent="অর্ডার সাবমিট";
  }
}

/* LOAD */

async function loadOrders(){

  const list=document.getElementById("orderList");

  try{

    allOrders=await window.OrderDatabase.loadAll();
    renderOrders(allOrders);

  }catch(error){

    console.error(error);

    list.innerHTML=
      '<div class="empty">'+
      escapeHtml(error?.message||"অর্ডার Load হয়নি।")+
      '</div>';
  }
}

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input",function(){

  const q=this.value.trim().toLowerCase();

  if(!q){
    renderOrders(allOrders);
    return;
  }

  const result=allOrders.filter(order=>{

    const searchable=[
      order.order_no,
      order.page_name,
      order.customer_text,
      order.order_text,
      order.phone,
      order.submitted_by,
      order.moderator_whatsapp
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return searchable.includes(q);
  });

  renderOrders(result);
});

/* RENDER */

function renderOrders(orders){

  const list=document.getElementById("orderList");

  if(!orders||!orders.length){
    list.innerHTML='<div class="empty">কোনো অর্ডার নেই।</div>';
    return;
  }

  list.innerHTML=orders.map(createOrderCard).join("");
}

function createOrderCard(order){

  const id=String(order.id||"");

  const text=
    order.customer_text||
    order.order_text||
    "";

  const images=
    Array.isArray(order.images)
    ?order.images
    :(Array.isArray(order.image_urls)?order.image_urls:[]);

  /* Customer phone শুধু নিচের Call/WhatsApp-এর জন্য */
  const phone=order.phone||extractPhone(text);

  const page=order.page_name||"";
  const submittedBy=order.submitted_by||"Admin";

  /* এটা Submitter-এর WhatsApp */
  const moderatorWhatsApp=
    order.moderator_whatsapp||"";

  const emergency=order.emergency===true;
  const callStatus=order.call_status||"not_called";

  const rawOrderNo=
    order.order_no||
    String(order.id||"").slice(0,8).toUpperCase();

  const orderNo=
    /^\d+$/.test(String(rawOrderNo))
    ?String(rawOrderNo).padStart(2,"0")
    :rawOrderNo;

  const tokenTime=formatTime(order.created_at);
  const tokenDate=formatDate(order.created_at);

  const mainImage=images.length
  ?`
    <div class="main-image-wrap">
      <img
        class="main-image"
        src="${escapeAttribute(images[0])}"
        loading="lazy"
        alt="Order image">
    </div>
  `
  :"";

  const extraImages=images.length>1
  ?`
    <div class="more-images">
      ${images.slice(1).map(url=>`
        <img
          src="${escapeAttribute(url)}"
          loading="lazy"
          alt="Order image">
      `).join("")}
    </div>
  `
  :"";

  return `
  <article class="order-card" id="card-${escapeAttribute(id)}">

    ${mainImage}
    ${extraImages}

    <div class="order-number">
      অর্ডার নাম্বার ${escapeHtml(orderNo)}
    </div>

    <div class="info-box">

      <div class="info-cell">
        <span class="info-label">▣ Page</span>
        <span class="info-value">${escapeHtml(page)}</span>
      </div>

      <div class="info-cell">
        <span class="info-label">👤 Submitted By</span>
        <span class="info-value">${escapeHtml(submittedBy)}</span>
      </div>

      <div class="info-cell">
        <span class="info-label">◷ Token Time</span>
        <span class="info-value">${escapeHtml(tokenTime)}</span>
        <span class="token-date">${escapeHtml(tokenDate)}</span>
      </div>

      <div class="info-cell">
        <span class="info-label">WhatsApp</span>

        <button
          class="submitter-wa"
          type="button"
          onclick="openSubmitterWhatsApp('${escapeJs(moderatorWhatsApp)}')">

          ${
            moderatorWhatsApp
            ?escapeHtml(moderatorWhatsApp)
            :"নম্বর যোগ করুন"
          }

        </button>
      </div>

    </div>

    <div class="action-row">

      <button
        class="action-btn ${emergency?"pending-btn":"emergency-btn"}"
        type="button"
        onclick="toggleEmergency('${escapeJs(id)}',${emergency})">

        ${
          emergency
          ?"🚨 Return Pending"
          :"🚨 Emergency"
        }

      </button>

      <button
        class="action-btn fraud-btn"
        type="button"
        onclick="fraudCheck('${escapeJs(id)}')">
        🛡 Fraud Check
      </button>

      <button
        class="action-btn delete-btn"
        type="button"
        onclick="deleteOrder('${escapeJs(id)}')">
        🗑 Delete
      </button>

    </div>

    <div class="call-status-row">

      <button
        class="call-status-btn ${
          callStatus==="called"
          ?"call-done"
          :"call-not-done"
        }"
        type="button"
        onclick="toggleCall('${escapeJs(id)}','${escapeJs(callStatus)}')">

        ${
          callStatus==="called"
          ?"✓ কল হয়েছে"
          :"📞 কল হয়নি"
        }

      </button>

    </div>

    <div
      id="fraud-${escapeAttribute(id)}"
      class="fraud-result">
    </div>

    <div class="customer-text">${escapeHtml(text)}</div>

    <div class="contact-row">

      <button
        class="contact-btn whatsapp-btn"
        type="button"
        onclick="openWhatsApp('${escapeJs(phone)}')">
        WhatsApp
      </button>

      <button
        class="contact-btn phone-btn"
        type="button"
        onclick="callCustomer('${escapeJs(phone)}')">
        📞 Call
      </button>

    </div>

    <div class="status-row">

      <div class="status-left">

        <span class="status-pill">
          Pending
        </span>

        ${
          emergency
          ?`
            <span class="emergency-note">
              🚨 Order sent to Emergency
            </span>
          `
          :""
        }

      </div>

      <div class="token-bottom">
        ${escapeHtml(tokenTime)}
      </div>

    </div>

    <div class="card-bottom-actions">

      <button
        class="square-btn edit-btn"
        type="button"
        onclick="openEdit('${escapeJs(id)}')">
        ✎
      </button>

      <button
        class="square-btn up-btn"
        type="button"
        onclick="scrollCardTop('${escapeJs(id)}')">
        ↑
      </button>

    </div>

    <div class="edit-area" id="edit-${escapeAttribute(id)}">

      <textarea id="editText-${escapeAttribute(id)}">${escapeHtml(text)}</textarea>

      <div class="edit-actions">

        <button
          class="edit-save"
          type="button"
          onclick="saveEdit('${escapeJs(id)}')">
          Save
        </button>

        <button
          class="edit-cancel"
          type="button"
          onclick="closeEdit('${escapeJs(id)}')">
          Cancel
        </button>

      </div>

    </div>

  </article>
  `;
}

/* EMERGENCY */

async function toggleEmergency(id,current){

  try{

    if(current){
      await window.OrderDatabase.removeEmergency(id);
    }else{
      await window.OrderDatabase.emergency(id);
    }

    await loadOrders();

  }catch(error){

    alert(error?.message||"Emergency update হয়নি।");
  }
}

/* CALL */

async function toggleCall(id,current){

  try{

    const next=
      current==="called"
      ?"not_called"
      :"called";

    await window.OrderDatabase.updateCall(id,next);
    await loadOrders();

  }catch(error){

    alert(error?.message||"Call status update হয়নি।");
  }
}

/* FRAUD */

function fraudCheck(id){

  const order=
    allOrders.find(
      item=>String(item.id)===String(id)
    );

  if(!order)return;

  const box=document.getElementById("fraud-"+id);
  if(!box)return;

  const phone=
    order.phone||
    extractPhone(
      order.customer_text||
      order.order_text||
      ""
    );

  const count=allOrders.filter(item=>{

    const itemPhone=
      item.phone||
      extractPhone(
        item.customer_text||
        item.order_text||
        ""
      );

    return phone&&phone===itemPhone;

  }).length;

  box.style.display=
    box.style.display==="block"
    ?"none"
    :"block";

  box.innerHTML=
    "<b>Fraud Check</b><br>"+
    "Mobile: "+
    escapeHtml(phone||"পাওয়া যায়নি")+
    "<br>Internal orders: "+
    count+
    " টি";
}

/* DELETE */

async function deleteOrder(id){

  const reason=prompt("Delete করার কারণ লিখুন:");

  if(reason===null)return;

  if(!reason.trim()){
    alert("Delete reason লিখুন।");
    return;
  }

  if(!confirm("এই অর্ডার Delete করতে চান?")){
    return;
  }

  try{

    await window.OrderDatabase.delete(id);
    await loadOrders();

  }catch(error){

    alert(error?.message||"Delete হয়নি।");
  }
}

/* EDIT */

function openEdit(id){

  const box=document.getElementById("edit-"+id);

  if(box){
    box.style.display="block";
  }
}

function closeEdit(id){

  const box=document.getElementById("edit-"+id);

  if(box){
    box.style.display="none";
  }
}

async function saveEdit(id){

  const input=document.getElementById("editText-"+id);
  if(!input)return;

  const text=input.value.trim();

  if(!text){
    alert("অর্ডারের তথ্য খালি রাখা যাবে না।");
    return;
  }

  const phone=extractPhone(text);

  if(!phone){
    alert("১১ সংখ্যার English মোবাইল নাম্বার দিন।");
    return;
  }

  try{

    await window.OrderDatabase.update(
      id,
      {
        customer_text:text,
        phone:phone
      }
    );

    await loadOrders();

  }catch(error){

    alert(error?.message||"Edit Save হয়নি।");
  }
}

  if(!phone){
    alert("কাস্টমারের মোবাইল নাম্বার পাওয়া যায়নি।");

  }

  let number=String(phone).replace(/\D/g,"");

  if(!phone){
    alert("কাস্টমারের মোবাইল নাম্বার পাওয়া যায়নি।");
    return;
  }

  location.href="tel:"+String(phone).replace(/\D/g,"");
}

function scrollCardTop(id){

  const card=document.getElementById("card-"+id);

  if(card){
    card.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

/* HELPERS */

function extractPhone(text){

  const match=String(text||"").match(/01\d{9}/);
  return match?match[0]:"";
}

function formatTime(value){

  if(!value)return "";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString(
    "en-BD",
    {
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  );
}

function formatDate(value){

  if(!value)return "";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJs(value){

  return String(value??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

/* REALTIME */

function startRealtime(){

  if(
    window.OrderDatabase&&
    typeof window.OrderDatabase.realtime==="function"
  ){

    window.OrderDatabase.realtime(function(){
      loadOrders();
    });
  }
}

/* START */

document.addEventListener(
"DOMContentLoaded",
async function(){

  try{

    if(!window.OrderDatabase){
      throw new Error("database.js load হয়নি।");
    }

    if(typeof window.OrderDatabase.init==="function"){
      window.OrderDatabase.init();
    }

    await loadOrders();
    startRealtime();

  }catch(error){

    console.error(error);

    document.getElementById("orderList").innerHTML=
      '<div class="empty">'+
      escapeHtml(error?.message||"Database load হয়নি।")+
      '</div>';
  }
});

</script>
