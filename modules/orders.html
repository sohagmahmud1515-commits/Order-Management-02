<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f83">

<title>All Order Group</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f8f7;
  color:#17202a;
  padding-bottom:78px;
}

button,input,select,textarea{
  font-family:inherit;
}

.header{
  height:68px;
  background:#087f83;
  color:white;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:11px;
  position:sticky;
  top:0;
  z-index:100;
}

.back{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.16);
  color:white;
  font-size:23px;
}

.header-title{
  font-size:20px;
  font-weight:800;
}

.container{
  max-width:650px;
  margin:auto;
  padding:11px;
}

.search{
  width:100%;
  height:45px;
  background:white;
  border:1px solid #d8e1df;
  border-radius:12px;
  padding:0 13px;
  font-size:14px;
  outline:none;
  margin-bottom:10px;
}

/* =========================
   SUBMIT
========================= */

.submit-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.submit-title{
  font-size:16px;
  font-weight:800;
  color:#087f83;
  margin-bottom:9px;
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:9px 0 5px;
}

select,
textarea{
  width:100%;
  border:1px solid #d4dfdd;
  border-radius:10px;
  background:white;
  font-size:14px;
  outline:none;
}

select{
  height:44px;
  padding:0 10px;
}

textarea{
  min-height:125px;
  padding:10px;
  resize:vertical;
  line-height:1.5;
}

.upload-box{
  border:2px dashed #b9cfcb;
  border-radius:10px;
  padding:10px;
  background:#fafdfc;
}

.upload-note{
  font-size:11px;
  color:#697472;
  margin-top:5px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:8px;
}

.preview-item{
  position:relative;
  aspect-ratio:1;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:7px;
}

.remove-image{
  position:absolute;
  right:-4px;
  top:-4px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#e53935;
  color:white;
  font-weight:bold;
}

.submit-btn{
  width:100%;
  height:46px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#087f83;
  color:white;
  font-size:15px;
  font-weight:800;
}

.submit-btn:disabled{
  opacity:.55;
}

.save-status{
  margin-top:7px;
  font-size:12px;
  font-weight:700;
  white-space:pre-line;
}

.list-title{
  font-size:16px;
  font-weight:800;
  margin:3px 2px 8px;
}

/* =========================
   FINAL ORDER CARD
========================= */

.order-card{
  position:relative;
  background:white;
  border-radius:17px;
  padding:9px;
  margin-bottom:13px;
  box-shadow:0 4px 13px rgba(0,0,0,.09);
  overflow:hidden;
}

/* BIG IMAGE */

.main-image-wrap{
  width:100%;
  border-radius:13px;
  overflow:hidden;
  background:#edf1f0;
  margin-bottom:7px;
}

.main-image{
  display:block;
  width:100%;
  max-height:390px;
  object-fit:cover;
}

.more-images{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin:5px 0 7px;
}

.more-images img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:7px;
}

/* ORDER NUMBER */

.order-number{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#d32f2f;
  margin:5px 0 7px;
}

/* INFO BOX */

.info-box{
  border:1px solid #dfe7e5;
  border-radius:9px;
  overflow:hidden;
  margin-bottom:6px;
}

.info-row{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.info-cell{
  min-height:37px;
  padding:5px 7px;
  border-bottom:1px solid #e6eceb;
  font-size:10px;
  color:#67716f;
}

.info-cell:nth-child(odd){
  border-right:1px solid #e6eceb;
}

.info-row:last-child .info-cell{
  border-bottom:0;
}

.info-value{
  display:block;
  margin-top:2px;
  color:#1d2827;
  font-size:11px;
  font-weight:800;
  overflow-wrap:anywhere;
}

.info-value.green{
  color:#148846;
}

/* TOP ACTIONS */

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin:6px 0;
}

.action-btn{
  height:34px;
  border:0;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}

.pending-btn{
  background:#fff1c9;
  color:#9c6900;
}

.emergency-btn{
  background:#ffe2e2;
  color:#d32f38;
}

.fraud-btn{
  background:#e6f0ff;
  color:#2467c7;
}

.delete-btn{
  background:#ffe6e6;
  color:#d8323a;
}

/* CALL STATUS */

.call-status-row{
  display:flex;
  justify-content:flex-end;
  margin:3px 0 5px;
}

.call-status-btn{
  min-width:82px;
  min-height:29px;
  padding:4px 8px;
  border:0;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}

.call-not-done{
  background:#ffe6e6;
  color:#d72d35;
}

.call-done{
  background:#e4f7e9;
  color:#148645;
}

/* FRAUD */

.fraud-result{
  display:none;
  border:1px solid #d7e5ff;
  background:#f3f7ff;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  line-height:1.45;
  margin-bottom:6px;
}

/* CUSTOMER TEXT */

.customer-text{
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:5px 3px 8px;
}

/* CONTACT */

.contact-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:4px;
}

.contact-btn{
  height:37px;
  border:0;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

.whatsapp-btn{
  background:#dff7e6;
  color:#11853e;
}

.phone-btn{
  background:#e2efff;
  color:#2467c5;
}

/* STATUS */

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-top:7px;
}

.status-left{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
}

.status-pill{
  min-height:26px;
  padding:5px 9px;
  border-radius:20px;
  background:#fff0c7;
  color:#9c6900;
  font-size:10px;
  font-weight:900;
}

.status-pill.emergency{
  background:#ffe1e1;
  color:#d62d35;
}

.emergency-note{
  font-size:10px;
  color:#d62d35;
  font-weight:800;
}

.token-bottom{
  font-size:9px;
  color:#78817f;
}

/* EDIT / UP */

.card-bottom-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:7px;
}

.square-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  font-size:15px;
  font-weight:900;
}

.edit-btn{
  background:#e7f5f2;
  color:#087f83;
}

.up-btn{
  background:#eef1f1;
  color:#47504f;
}

/* EDIT BOX */

.edit-area{
  display:none;
  margin-top:7px;
  border-top:1px solid #edf1f0;
  padding-top:7px;
}

.edit-area textarea{
  min-height:115px;
}

.edit-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:6px;
}

.edit-save,
.edit-cancel{
  height:35px;
  border:0;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}

.edit-save{
  background:#087f83;
  color:white;
}

.edit-cancel{
  background:#edf1f0;
  color:#444;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px 10px;
  color:#747e7c;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:white;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  box-shadow:0 -3px 12px rgba(0,0,0,.06);
  z-index:100;
}

.nav-btn{
  border:0;
  background:white;
  color:#616b69;
  font-size:12px;
  font-weight:700;
}

.nav-btn.active{
  color:#087f83;
  background:#e7f6f3;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:2px;
}

@media(max-width:380px){
  .container{padding:8px}
  .order-card{padding:8px}
  .main-image{max-height:350px}
}
</style>
</head>

<body>

<header class="header">
  <button class="back" onclick="goHome()">‹</button>
  <div class="header-title">All Order Group</div>
</header>

<main class="container">

<input
  id="searchInput"
  class="search"
  type="search"
  placeholder="নাম / মোবাইল / লোকেশন / Order No. দিয়ে Search">

<section class="submit-card">

<div class="submit-title">
  নতুন অর্ডার সাবমিট
</div>

<label class="label">Page</label>

<select id="pageSelect">
  <option value="">পেজ সিলেক্ট করুন</option>
  <option value="Sehzadi online shop">Sehzadi online shop</option>
  <option value="Abaya House">Abaya House</option>
  <option value="Maya Borka House">Maya Borka House</option>
  <option value="Mahira Fashion">Mahira Fashion</option>
  <option value="Black Beauty Abaya">Black Beauty Abaya</option>
</select>

<label class="label">ছবি</label>

<div class="upload-box">

<input
  id="imageInput"
  type="file"
  accept="image/*"
  multiple>

<div class="upload-note">
  কমপক্ষে ১টি, সর্বোচ্চ ৭টি ছবি
</div>

<div id="imagePreview" class="preview"></div>

</div>

<label class="label">
  কাস্টমারের সম্পূর্ণ অর্ডার
</label>

<textarea
  id="orderText"
  placeholder="নাম, মোবাইল নাম্বার, ঠিকানা, লং/সাইজ, কালার, পরিমাণ, নোট—সব এখানে লিখুন"></textarea>

<button
  id="submitBtn"
  class="submit-btn"
  type="button">
  অর্ডার সাবমিট
</button>

<div
  id="saveStatus"
  class="save-status">
</div>

</section>

<div class="list-title">
  All Orders
</div>

<div id="orderList">
  <div class="empty">Loading...</div>
</div>

</main>

<nav class="bottom-nav">

<button class="nav-btn active" onclick="goHome()">
  <span class="nav-icon">📦</span>
  Orders
</button>

<button class="nav-btn" onclick="goCourier()">
  <span class="nav-icon">🚚</span>
  Courier
</button>

<button class="nav-btn" onclick="goSettings()">
  <span class="nav-icon">⚙️</span>
  Settings
</button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./database.js"></script>

<script>

let selectedImages=[];
let allOrders=[];


/* NAV */

function goHome(){
  location.href="../index.html";
}

function goCourier(){
  location.href="./courier.html";
}

function goSettings(){
  location.href="./settings.html";
}


/* IMAGE */

const imageInput=
document.getElementById("imageInput");

imageInput.addEventListener("change",function(){

  const files=Array.from(this.files||[]);

  if(!files.length)return;

  const remaining=7-selectedImages.length;

  if(remaining<=0){
    alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
    this.value="";
    return;
  }

  if(files.length>remaining){
    alert("সর্বোচ্চ ৭টি ছবি দেওয়া যাবে।");
  }

  selectedImages.push(
    ...files.slice(0,remaining)
  );

  this.value="";

  renderPreview();
});


function renderPreview(){

  const box=
  document.getElementById("imagePreview");

  box.innerHTML="";

  selectedImages.forEach((file,index)=>{

    const wrap=
    document.createElement("div");

    wrap.className="preview-item";

    const img=
    document.createElement("img");

    const url=
    URL.createObjectURL(file);

    img.src=url;

    img.onload=()=>{
      URL.revokeObjectURL(url);
    };

    const remove=
    document.createElement("button");

    remove.type="button";
    remove.className="remove-image";
    remove.textContent="×";

    remove.onclick=()=>{

      selectedImages.splice(index,1);

      renderPreview();
    };

    wrap.appendChild(img);
    wrap.appendChild(remove);

    box.appendChild(wrap);
  });
}


/* SUBMIT */

document
.getElementById("submitBtn")
.addEventListener("click",submitOrder);


async function submitOrder(){

  const page=
  document.getElementById("pageSelect")
  .value.trim();

  const text=
  document.getElementById("orderText")
  .value.trim();

  if(!page){
    alert("পেজ সিলেক্ট করুন।");
    return;
  }

  if(selectedImages.length<1){
    alert("অন্তত ১টি ছবি দিন।");
    return;
  }

  if(!text){
    alert("কাস্টমারের সম্পূর্ণ অর্ডার লিখুন।");
    return;
  }

  if(!/01\d{9}/.test(text)){
    alert(
      "অর্ডারের মধ্যে ১১ সংখ্যার English মোবাইল নাম্বার দিন।"
    );
    return;
  }

  const btn=
  document.getElementById("submitBtn");

  const status=
  document.getElementById("saveStatus");

  btn.disabled=true;
  btn.textContent="সাবমিট হচ্ছে...";

  try{

    await window.OrderDatabase.save({
      page:page,
      orderText:text,
      customerText:text,
      images:selectedImages,
      submittedBy:"Admin",
      moderatorWhatsapp:""
    });

    status.textContent=
    "✓ অর্ডার সফলভাবে Save হয়েছে।";

    document.getElementById("orderText").value="";

    selectedImages=[];

    renderPreview();

    await loadOrders();

  }catch(error){

    console.error(error);

    const message=
    error?.message||"অর্ডার Save হয়নি।";

    status.textContent="✕ "+message;

    alert(message);

  }finally{

    btn.disabled=false;
    btn.textContent="অর্ডার সাবমিট";
  }
}


/* LOAD */

async function loadOrders(){

  const list=
  document.getElementById("orderList");

  try{

    allOrders=
    await window.OrderDatabase.loadAll();

    renderOrders(allOrders);

  }catch(error){

    console.error(error);

    list.innerHTML=
    '<div class="empty">'+
    escapeHtml(error?.message||"অর্ডার Load হয়নি।")+
    '</div>';
  }
}


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener("input",function(){

  const q=this.value
  .trim()
  .toLowerCase();

  if(!q){

    renderOrders(allOrders);

    return;
  }

  const result=
  allOrders.filter(order=>{

    const searchable=[
      order.order_no,
      order.page_name,
      order.customer_text,
      order.order_text,
      order.phone,
      order.submitted_by,
      order.moderator_whatsapp
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return searchable.includes(q);
  });

  renderOrders(result);
});


/* RENDER */

function renderOrders(orders){

  const list=
  document.getElementById("orderList");

  if(!orders||!orders.length){

    list.innerHTML=
    '<div class="empty">কোনো অর্ডার নেই।</div>';

    return;
  }

  list.innerHTML=
  orders.map(createOrderCard).join("");
}


function createOrderCard(order){

  const id=String(order.id||"");

  const text=
  order.customer_text||
  order.order_text||
  "";

  const images=
  Array.isArray(order.images)
  ?order.images
  :(
    Array.isArray(order.image_urls)
    ?order.image_urls
    :[]
  );

  const phone=
  order.phone||
  extractPhone(text);

  const page=
  order.page_name||"";

  const submittedBy=
  order.submitted_by||"Admin";

  const moderatorWhatsApp=
  order.moderator_whatsapp||"";

  const emergency=
  order.emergency===true;

  const callStatus=
  order.call_status||"not_called";

  const orderNo=
  order.order_no||
  String(order.id||"")
  .slice(0,8)
  .toUpperCase();

  const tokenTime=
  formatTime(order.created_at);

  const tokenDate=
  formatDate(order.created_at);

  const mainImage=
  images.length
  ?`
    <div class="main-image-wrap">
      <img
        class="main-image"
        src="${escapeAttribute(images[0])}"
        loading="lazy"
        alt="Order image">
    </div>
  `
  :"";

  const extraImages=
  images.length>1
  ?`
    <div class="more-images">
      ${images.slice(1).map(url=>`
        <img
          src="${escapeAttribute(url)}"
          loading="lazy"
          alt="Order image">
      `).join("")}
    </div>
  `
  :"";

  return `
  <article
    class="order-card"
    id="card-${escapeAttribute(id)}">

    ${mainImage}
    ${extraImages}

    <div class="order-number">
      অর্ডার নাম্বার ${escapeHtml(orderNo)}
    </div>


    <div class="info-box">

      <div class="info-row">

        <div class="info-cell">
          Page
          <span class="info-value">
            ${escapeHtml(page)}
          </span>
        </div>

        <div class="info-cell">
          Submitted By
          <span class="info-value">
            ${escapeHtml(submittedBy)}
          </span>
        </div>

      </div>


      <div class="info-row">

        <div class="info-cell">
          Token Time
          <span class="info-value">
            ${escapeHtml(tokenTime)}
          </span>
        </div>

        <div class="info-cell">
          Date
          <span class="info-value">
            ${escapeHtml(tokenDate)}
          </span>
        </div>

      </div>


      <div class="info-row">

        <div class="info-cell">
          WhatsApp
          <span class="info-value green">
            ${escapeHtml(
              moderatorWhatsApp||"—"
            )}
          </span>
        </div>

        <div class="info-cell">
          Customer
          <span class="info-value">
            ${escapeHtml(phone||"—")}
          </span>
        </div>

      </div>

    </div>


    <div class="action-row">

      <button
        class="action-btn ${emergency?"pending-btn":"emergency-btn"}"
        type="button"
        onclick="toggleEmergency(
          '${escapeJs(id)}',
          ${emergency}
        )">

        ${
          emergency
          ?"Return Pending"
          :"Emergency"
        }

      </button>


      <button
        class="action-btn fraud-btn"
        type="button"
        onclick="fraudCheck('${escapeJs(id)}')">

        Fraud Check

      </button>


      <button
        class="action-btn delete-btn"
        type="button"
        onclick="deleteOrder('${escapeJs(id)}')">

        Delete

      </button>

    </div>


    <div class="call-status-row">

      <button
        class="call-status-btn ${
          callStatus==="called"
          ?"call-done"
          :"call-not-done"
        }"
        type="button"
        onclick="toggleCall(
          '${escapeJs(id)}',
          '${escapeJs(callStatus)}'
        )">

        ${
          callStatus==="called"
          ?"কল হয়েছে"
          :"কল হয়নি"
        }

      </button>

    </div>


    <div
      id="fraud-${escapeAttribute(id)}"
      class="fraud-result">
    </div>


    <div class="customer-text">
      ${escapeHtml(text)}
    </div>


    <div class="contact-row">

      <button
        class="contact-btn whatsapp-btn"
        type="button"
        onclick="openWhatsApp('${escapeJs(phone)}')">

        WhatsApp

      </button>


      <button
        class="contact-btn phone-btn"
        type="button"
        onclick="callCustomer('${escapeJs(phone)}')">

        📞 Call

      </button>

    </div>


    <div class="status-row">

      <div class="status-left">

        <span class="status-pill ${emergency?"emergency":""}">
          ${emergency?"Emergency":"Pending"}
        </span>

        ${
          emergency
          ?`
            <span class="emergency-note">
              Order sent to Emergency
            </span>
          `
          :""
        }

      </div>

      <div class="token-bottom">
        ${escapeHtml(tokenTime)}
      </div>

    </div>


    <div class="card-bottom-actions">

      <button
        class="square-btn edit-btn"
        type="button"
        onclick="openEdit('${escapeJs(id)}')">

        ✎

      </button>

      <button
        class="square-btn up-btn"
        type="button"
        onclick="scrollCardTop('${escapeJs(id)}')">

        ↑

      </button>

    </div>


    <div
      class="edit-area"
      id="edit-${escapeAttribute(id)}">

      <textarea
        id="editText-${escapeAttribute(id)}">${escapeHtml(text)}</textarea>

      <div class="edit-actions">

        <button
          class="edit-save"
          type="button"
          onclick="saveEdit('${escapeJs(id)}')">

          Save

        </button>

        <button
          class="edit-cancel"
          type="button"
          onclick="closeEdit('${escapeJs(id)}')">

          Cancel

        </button>

      </div>

    </div>

  </article>
  `;
}


/* EMERGENCY */

async function toggleEmergency(id,current){

  try{

    if(current){

      await window.OrderDatabase
      .removeEmergency(id);

    }else{

      await window.OrderDatabase
      .emergency(id);
    }

    await loadOrders();

  }catch(error){

    alert(
      error?.message||
      "Emergency update হয়নি।"
    );
  }
}


/* CALL */

async function toggleCall(id,current){

  try{

    const next=
    current==="called"
    ?"not_called"
    :"called";

    await window.OrderDatabase
    .updateCall(id,next);

    await loadOrders();

  }catch(error){

    alert(
      error?.message||
      "Call status update হয়নি।"
    );
  }
}


/* FRAUD */

function fraudCheck(id){

  const order=
  allOrders.find(
    item=>String(item.id)===String(id)
  );

  if(!order)return;

  const box=
  document.getElementById("fraud-"+id);

  if(!box)return;

  const phone=
  order.phone||
  extractPhone(
    order.customer_text||
    order.order_text||
    ""
  );

  const count=
  allOrders.filter(item=>{

    const itemPhone=
    item.phone||
    extractPhone(
      item.customer_text||
      item.order_text||
      ""
    );

    return phone&&phone===itemPhone;

  }).length;

  box.style.display=
  box.style.display==="block"
  ?"none"
  :"block";

  box.innerHTML=
  "<b>Fraud Check</b><br>"+
  "Mobile: "+
  escapeHtml(phone||"পাওয়া যায়নি")+
  "<br>Internal orders: "+
  count+
  " টি";
}


/* DELETE */

async function deleteOrder(id){

  const reason=
  prompt("Delete করার কারণ লিখুন:");

  if(reason===null)return;

  if(!reason.trim()){

    alert("Delete reason লিখুন।");
    return;
  }

  if(!confirm("এই অর্ডার Delete করতে চান?")){
    return;
  }

  try{

    await window.OrderDatabase.delete(id);

    await loadOrders();

  }catch(error){

    alert(
      error?.message||
      "Delete হয়নি।"
    );
  }
}


/* EDIT */

function openEdit(id){

  const box=
  document.getElementById("edit-"+id);

  if(box){
    box.style.display="block";
  }
}


function closeEdit(id){

  const box=
  document.getElementById("edit-"+id);

  if(box){
    box.style.display="none";
  }
}


async function saveEdit(id){

  const input=
  document.getElementById(
    "editText-"+id
  );

  if(!input)return;

  const text=
  input.value.trim();

  if(!text){

    alert("অর্ডারের তথ্য খালি রাখা যাবে না।");
    return;
  }

  const phone=
  extractPhone(text);

  if(!phone){

    alert(
      "১১ সংখ্যার English মোবাইল নাম্বার দিন।"
    );

    return;
  }

  try{

    await window.OrderDatabase.update(
      id,
      {
        customer_text:text,
        phone:phone
      }
    );

    await loadOrders();

  }catch(error){

    alert(
      error?.message||
      "Edit Save হয়নি।"
    );
  }
}


/* CONTACT */

function openWhatsApp(phone){

  if(!phone){

    alert("মোবাইল নাম্বার পাওয়া যায়নি।");

  }

  String(phone).replace(/\D/g,"");

}


function callCustomer(phone){

  if(!phone){

    alert("মোবাইল নাম্বার পাওয়া যায়নি।");
    return;
  }

  location.href=
  "tel:"+
  String(phone).replace(/\D/g,"");
}


function scrollCardTop(id){

  const card=
  document.getElementById("card-"+id);

  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}


/* HELPERS */

function extractPhone(text){

  const match=
  String(text||"")
  .match(/01\d{9}/);

  return match?match[0]:"";
}


function formatTime(value){

  if(!value)return "";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString(
    "en-BD",
    {
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  );
}


function formatDate(value){

  if(!value)return "";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}


function escapeHtml(value){

  return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function escapeAttribute(value){
  return escapeHtml(value);
}


function escapeJs(value){

  return String(value??"")
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");
}


/* REALTIME */

function startRealtime(){

  if(
    window.OrderDatabase&&
    typeof window.OrderDatabase.realtime
    ==="function"
  ){

    window.OrderDatabase.realtime(
      function(){
        loadOrders();
      }
    );
  }
}


/* START */

document.addEventListener(
"DOMContentLoaded",
async function(){

  try{

    if(!window.OrderDatabase){

      throw new Error(
        "database.js load হয়নি।"
      );
    }

    if(
      typeof window.OrderDatabase.init
      ==="function"
    ){
      window.OrderDatabase.init();
    }

    await loadOrders();

    startRealtime();

  }catch(error){

    console.error(error);

    document.getElementById(
      "orderList"
    ).innerHTML=
    '<div class="empty">'+
    escapeHtml(
      error?.message||
      "Database load হয়নি।"
    )+
    '</div>';
  }

});

</script>
